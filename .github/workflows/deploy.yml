name: Deploy MiDoc to GitHub Pages

on:
  push:
    branches:
      - main
      # Preview is published by a safe deploy from main; feature branch commits never replace production.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production site
        uses: actions/checkout@v6
        with:
          ref: main
          path: site-main

      - name: Checkout preview revision
        uses: actions/checkout@v6
        with:
          ref: test/midoc-preview-final-v6-20261128
          path: site-preview

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble production site and isolated preview
        shell: bash
        run: |
          mkdir -p _site/preview-v6
          cp -a site-main/. _site/
          rm -rf _site/preview-v6
          mkdir -p _site/preview-v6
          cp site-preview/index.html _site/preview-v6/index.html
          cp site-preview/midoc-icon.svg _site/preview-v6/midoc-icon.svg
          cp site-preview/manifest.webmanifest _site/preview-v6/manifest.webmanifest

      - name: Upload website files
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
