name: MiDoc Preview Validation

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate supplied MiDoc Studio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check inline JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const blocks = html.split('<script').slice(1);
          const inlineScripts = [];

          for (const block of blocks) {
            const endOfOpenTag = block.indexOf('>');
            if (endOfOpenTag < 0) continue;
            const attributes = block.slice(0, endOfOpenTag);
            if (attributes.includes('src=')) continue;
            const body = block.slice(endOfOpenTag + 1);
            const endOfScript = body.indexOf('</script>');
            if (endOfScript < 0) continue;
            inlineScripts.push(body.slice(0, endOfScript));
          }

          if (inlineScripts.length === 0) throw new Error('No inline JavaScript was found.');
          inlineScripts.forEach((script, index) => {
            new vm.Script(script, { filename: 'index.html:inline-script-' + (index + 1) });
          });
          console.log('Inline JavaScript syntax OK: ' + inlineScripts.length + ' script blocks.');
          NODE

      - name: Audit supplied tool catalog and engines
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const catalog = html.match(/const DIRECTORY_GROUPS = \[([\s\S]*?)\n    \];/)?.[1] || '';
          const tools = [...catalog.matchAll(/\{\s*id:\s*'([^']+)',\s*name:\s*'([^']+)'[\s\S]*?engine:\s*'([^']+)'\s*,\s*accept:\s*'([^']*)'\s*,\s*multiple:\s*(true|false)/g)]
            .map(match => ({ id: match[1], name: match[2], engine: match[3], accept: match[4], multiple: match[5] }));
          const groups = [...catalog.matchAll(/\{\s*id:\s*'([^']+)'\s*,\s*navCat:\s*'([^']+)'\s*,\s*title:\s*'([^']+)'/g)]
            .map(match => ({ id: match[1], navCat: match[2], title: match[3] }));
          const expectedGroups = [
            'Gabung, Pisah & Halaman',
            'Edit & Optimasi PDF',
            'Konversi ke PDF',
            'Konversi dari PDF',
            'Kompres & Konversi Gambar',
            'Potong, Ukuran & Susun',
            'Warna, Efek & Metadata',
            'Utilitas & Batch Tools'
          ];
          if (tools.length !== 28) throw new Error('Expected 28 tools, found ' + tools.length);
          if (groups.length !== 8) throw new Error('Expected 8 directory groups, found ' + groups.length);
          if (JSON.stringify(groups.map(group => group.title)) !== JSON.stringify(expectedGroups)) {
            throw new Error('The supplied eight-group directory structure changed.');
          }
          const ids = tools.map(tool => tool.id);
          const duplicateIds = ids.filter((id, index) => ids.indexOf(id) !== index);
          if (duplicateIds.length) throw new Error('Duplicate tool IDs: ' + duplicateIds.join(', '));
          const missingInputRules = tools.filter(tool => typeof tool.accept !== 'string' || !['true', 'false'].includes(tool.multiple));
          if (missingInputRules.length) throw new Error('Missing file input rules: ' + missingInputRules.map(tool => tool.id).join(', '));

          const required = [
            ['Hash navigation', 'handleRouteFromHash'],
            ['Directory search', 'function renderHomeDirectory'],
            ['Mega menu', 'function openMegaMenu'],
            ['Browser-side file validation', 'function isFileAllowedForCurrentTool'],
            ['Interactive image crop', 'async function runCropImagePixel'],
            ['Interactive PDF crop', 'async function runCropPdfInteractive'],
            ['PDF generation', 'async function runMergePdfAndImages'],
            ['Document-to-PDF editor', 'async function runDocToPdf'],
            ['Image conversion', 'async function runConvertImage'],
            ['Image resize', 'async function runImageResize'],
            ['Grid splitter', 'async function runImageSplitter'],
            ['Image joiner', 'async function runJoinImages'],
            ['Layer overlay', 'async function runLayerOverlay'],
            ['ZIP create and extract', 'async function runZipTools'],
            ['GIF encoder', 'function encodeSimpleAnimatedGif'],
            ['QR/barcode preview', 'function renderQrBarcodeLargeStage'],
            ['Password generator', 'function generateNewPasswordText'],
            ['Preview before user download', 'function stageResultForUserDownload'],
            ['Explicit download control', 'id="reDownloadBtn"']
          ];
          const missing = required.filter(([, marker]) => !html.includes(marker)).map(([label]) => label);
          if (missing.length) throw new Error('Missing expected Studio feature: ' + missing.join(', '));
          if (!html.includes('https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js')) throw new Error('PDF-Lib dependency is missing.');
          if (!html.includes('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js')) throw new Error('JSZip dependency is missing.');
          if (!html.includes('https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js')) throw new Error('JsBarcode dependency is missing.');
          console.log('Catalog audit passed: ' + tools.length + ' tools across ' + groups.length + ' groups.');
          NODE

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run Studio browser smoke tests
        run: |
          python3 -m http.server 4173 --directory . > /tmp/midoc-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          node tests/browser-smoke.cjs
